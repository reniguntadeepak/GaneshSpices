services:
  - type: web
    name: ganesh-spices-api
    runtime: node
    # Repo root (Root Directory on dashboard must be EMPTY)
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
